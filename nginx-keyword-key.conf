# ============================================================
# Nginx Reverse Proxy Config for Hostinger VPS
# ============================================================
# Copy this file to /etc/nginx/sites-available/keyword-key
# Then: ln -s /etc/nginx/sites-available/keyword-key /etc/nginx/sites-enabled/
# Test:  nginx -t
# Reload: systemctl reload nginx
# ============================================================

# Upstream definition — Next.js standalone server on port 3000
upstream keyword_key {
    server 127.0.0.1:3000;
    keepalive 64;
}

# HTTP — redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com www.your-domain.com;

    # Redirect all HTTP to HTTPS
    return 301 https://$host$request_uri;
}

# HTTPS — main server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name your-domain.com www.your-domain.com;

    # --- SSL Certificates ---
    # Use Let's Encrypt (free): sudo certbot --nginx -d your-domain.com -d www.your-domain.com
    # After certbot runs, it will auto-fill these paths:
    ssl_certificate /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;

    # SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Max upload size
    client_max_body_size 50M;

    # Next.js standalone doesn't serve .next/static or public by default,
    # so we serve them directly from the build output
    location /_next/static/ {
        alias /var/www/keyword-key/.next/static/;
        expires 365d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /public/ {
        alias /var/www/keyword-key/public/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Serve images and static assets from public directly
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|woff|woff2|ttf|eot|css|js)$ {
        root /var/www/keyword-key/public;
        try_files $uri @nextjs;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Proxy all other requests to Next.js
    location @nextjs {
        proxy_pass http://keyword_key;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    # Main proxy — all dynamic requests
    location / {
        proxy_pass http://keyword_key;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;

        # WebSocket support (for real-time features if added later)
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Disable access to sensitive files
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }
}
